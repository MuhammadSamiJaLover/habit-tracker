<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Habit Tracker PWA</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050811">
    
    <style>
        :root {
            --bg-black: #050811;
            --card-cyan: #00f0ff;
            --card-green: #00ff66;
            --card-pink: #ff007f;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --green-glow: rgba(0, 255, 102, 0.35);
            --pink-glow: rgba(255, 0, 127, 0.35);
            --text-main: #ffffff;
            --text-dim: #708090;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 15px) 16px 110px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* Dashboard Analytics Header */
        .dashboard-header {
            background: rgba(10, 16, 28, 0.85);
            border: 1.5px solid rgba(0, 240, 255, 0.4);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 0 20px var(--cyan-glow);
            margin-bottom: 22px;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 15px;
            align-items: center;
        }

        .ring-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 7;
        }

        .ring-progress {
            fill: none;
            stroke: url(#cyan-green-grad);
            stroke-width: 7;
            stroke-dasharray: 264;
            stroke-dashoffset: 264;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .ring-info {
            position: absolute;
            text-align: center;
        }

        .ring-percent {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--card-cyan);
            text-shadow: 0 0 10px var(--card-cyan);
        }

        .ring-label {
            font-size: 0.55rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            font-weight: 700;
            margin-top: 2px;
        }

        .graph-box {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100px;
        }

        .line-svg {
            width: 100%;
            height: 60px;
        }

        .line-svg path {
            fill: none;
            stroke: var(--card-cyan);
            stroke-width: 2.5;
            filter: drop-shadow(0px 0px 6px var(--card-cyan));
        }

        .week-days {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-dim);
            font-weight: 700;
        }

        /* Section Titles */
        .section-header {
            margin-bottom: 12px;
        }

        .section-title-main {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .section-title-sub {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .title-start { color: var(--card-cyan); }
        .title-quit { color: var(--card-pink); }

        /* Grid Containers */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .empty-msg {
            grid-column: span 2;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 15px 0;
        }

        /* Habit Cards */
        .habit-card {
            background: rgba(10, 16, 28, 0.8);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .card-start {
            border: 1.5px solid var(--card-cyan);
            box-shadow: 0 0 14px var(--cyan-glow);
        }

        .card-start.done {
            border-color: var(--card-green);
            box-shadow: 0 0 14px var(--green-glow);
        }

        .card-quit {
            border: 1.5px solid var(--card-pink);
            box-shadow: 0 0 14px var(--pink-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-icon {
            font-size: 0.95rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-dim);
            font-weight: 700;
        }

        /* Action Buttons */
        .btn-track {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid var(--card-cyan);
            color: var(--card-cyan);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .btn-done {
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--card-green);
            color: var(--card-green);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-quit-done {
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--card-pink);
            color: var(--card-pink);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-del {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.85rem;
            cursor: pointer;
            padding-left: 6px;
        }

        /* Input Form */
        .add-form {
            background: rgba(10, 16, 28, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 22px;
            display: flex;
            gap: 8px;
        }

        .add-input {
            flex: 1;
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
        }

        .add-select {
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            outline: none;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--card-cyan), var(--card-green));
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .nav-dock {
            position: fixed;
            z-index: 2;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 390px;
            background: rgba(10, 16, 28, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .dock-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--card-cyan);
            font-size: 0.65rem;
            font-weight: 700;
        }

        .dock-icon {
            font-size: 1.2rem;
        }

        .page-title {
            margin: 4px 2px 18px;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 0.04em;
        }

        .page-title span {
            color: var(--card-cyan);
        }

        @media (max-width: 360px) {
            .add-form {
                flex-wrap: wrap;
            }

            .add-input {
                min-width: 100%;
            }

            .add-select {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <h1 class="page-title">Habit <span>Tracker</span></h1>

    <section class="dashboard-header" aria-label="Daily progress">
        <div class="ring-box">
            <svg class="ring-svg" viewBox="0 0 110 110" aria-hidden="true">
                <defs>
                    <linearGradient id="cyan-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#00ff66" />
                    </linearGradient>
                </defs>
                <circle class="ring-bg" cx="55" cy="55" r="42"></circle>
                <circle class="ring-progress" id="ringProgress" cx="55" cy="55" r="42"></circle>
            </svg>
            <div class="ring-info">
                <div class="ring-percent" id="ringPercent">0%</div>
                <div class="ring-label">DONE TODAY</div>
            </div>
        </div>
        <div class="graph-box">
            <svg class="line-svg" viewBox="0 0 140 60" preserveAspectRatio="none" aria-hidden="true">
                <path id="weekGraph" d=""></path>
            </svg>
            <div class="week-days" id="weekDays" aria-hidden="true"></div>
        </div>
    </section>

    <form class="add-form" id="addForm">
        <input type="text" id="habitInput" class="add-input" maxlength="60"
            placeholder="New Habit Name" aria-label="New habit name" required>
        <select id="habitType" class="add-select" aria-label="Habit type">
            <option value="start">START</option>
            <option value="quit">QUIT</option>
        </select>
        <button class="add-btn" type="submit">+ ADD</button>
    </form>

    <section aria-labelledby="startHeading">
        <div class="section-header">
            <div class="section-title-main">Active Habits</div>
            <h2 class="section-title-sub title-start" id="startHeading">START (Building)</h2>
        </div>
        <div class="grid-container" id="startContainer"></div>
    </section>

    <section aria-labelledby="quitHeading">
        <div class="section-header">
            <h2 class="section-title-sub title-quit" id="quitHeading">QUIT (Breaking)</h2>
        </div>
        <div class="grid-container" id="quitContainer"></div>
    </section>

    <nav class="nav-dock" aria-label="Main navigation">
        <div class="dock-tab active" aria-current="page">
            <span class="dock-icon" aria-hidden="true">🏠</span>
            <span>Dashboard</span>
        </div>
    </nav>

    <script>
        const STORAGE_KEY = 'cyber_habits_custom';
        const todayStr = localDateString(new Date());
        let habits = loadHabits();

        function localDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function loadHabits() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                if (!Array.isArray(saved)) {
                    console.error('Saved habit data is not a list.');
                    return [];
                }

                return saved
                    .filter(item => item && typeof item === 'object')
                    .map((item, index) => ({
                        id: String(item.id || `habit-${index}`),
                        title: String(item.title || '').trim().slice(0, 60),
                        type: item.type === 'quit' ? 'quit' : 'start',
                        icon: typeof item.icon === 'string' ? item.icon : (item.type === 'quit' ? '🚫' : '⚡'),
                        completedDates: Array.isArray(item.completedDates)
                            ? item.completedDates.filter(date => typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date))
                            : []
                    }))
                    .filter(item => item.title);
            } catch (error) {
                console.error('Could not load saved habits:', error);
                return [];
            }
        }

        function saveHabits() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
            } catch (error) {
                console.error('Could not save habits:', error);
                alert('Your changes could not be saved in this browser.');
            }
            render();
        }

        function getStreak(habit) {
            const dates = new Set(habit.completedDates);
            const date = new Date();
            if (!dates.has(localDateString(date))) date.setDate(date.getDate() - 1);

            let streak = 0;
            while (dates.has(localDateString(date))) {
                streak += 1;
                date.setDate(date.getDate() - 1);
            }
            return streak;
        }

        function createHabitCard(habit) {
            const isDone = habit.completedDates.includes(todayStr);
            const card = document.createElement('article');
            card.className = `habit-card ${habit.type === 'quit' ? 'card-quit' : `card-start${isDone ? ' done' : ''}`}`;

            const header = document.createElement('div');
            header.className = 'card-header';
            const title = document.createElement('span');
            title.className = 'card-title';
            title.textContent = habit.title;
            const icon = document.createElement('span');
            icon.className = 'card-icon';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = habit.icon;
            header.append(title, icon);

            const footer = document.createElement('div');
            footer.className = 'card-footer';
            const streak = document.createElement('span');
            streak.textContent = `🔥 ${getStreak(habit)} day streak`;

            const actions = document.createElement('span');
            const track = document.createElement('button');
            track.className = isDone
                ? (habit.type === 'quit' ? 'btn-quit-done' : 'btn-done')
                : 'btn-track';
            track.type = 'button';
            track.textContent = isDone ? 'DONE ✓' : 'TRACK';
            track.setAttribute('aria-label', `${isDone ? 'Unmark' : 'Mark'} ${habit.title} ${habit.type === 'quit' ? 'avoided' : 'complete'} today`);
            track.addEventListener('click', () => toggleHabit(habit.id));

            const remove = document.createElement('button');
            remove.className = 'btn-del';
            remove.type = 'button';
            remove.textContent = '×';
            remove.setAttribute('aria-label', `Delete ${habit.title}`);
            remove.addEventListener('click', () => deleteHabit(habit.id));

            actions.append(track, remove);
            footer.append(streak, actions);
            card.append(header, footer);
            return card;
        }

        function renderGroup(container, group) {
            container.replaceChildren();
            if (group.length === 0) {
                const message = document.createElement('p');
                message.className = 'empty-msg';
                message.textContent = 'No habits here yet.';
                container.append(message);
                return;
            }
            group.forEach(habit => container.append(createHabitCard(habit)));
        }

        function updateDashboard() {
            const completedToday = habits.filter(habit => habit.completedDates.includes(todayStr)).length;
            const percent = habits.length ? Math.round((completedToday / habits.length) * 100) : 0;
            document.getElementById('ringPercent').textContent = `${percent}%`;
            document.getElementById('ringProgress').style.strokeDashoffset = String(264 - (264 * percent / 100));

            const days = [];
            const completionByDay = [];
            for (let daysAgo = 6; daysAgo >= 0; daysAgo -= 1) {
                const date = new Date();
                date.setDate(date.getDate() - daysAgo);
                const dateString = localDateString(date);
                days.push(date.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 1));
                const count = habits.filter(habit => habit.completedDates.includes(dateString)).length;
                completionByDay.push(habits.length ? count / habits.length : 0);
            }

            document.getElementById('weekDays').replaceChildren(
                ...days.map(day => {
                    const label = document.createElement('span');
                    label.textContent = day;
                    return label;
                })
            );
            const points = completionByDay.map((value, index) => {
                const x = index * (140 / 6);
                const y = 52 - value * 42;
                return `${index === 0 ? 'M' : 'L'} ${x} ${y}`;
            });
            document.getElementById('weekGraph').setAttribute('d', points.join(' '));
        }

        function render() {
            renderGroup(document.getElementById('startContainer'), habits.filter(habit => habit.type === 'start'));
            renderGroup(document.getElementById('quitContainer'), habits.filter(habit => habit.type === 'quit'));
            updateDashboard();
        }

        function toggleHabit(id) {
            const habit = habits.find(item => item.id === id);
            if (!habit) return;
            const index = habit.completedDates.indexOf(todayStr);
            if (index >= 0) habit.completedDates.splice(index, 1);
            else habit.completedDates.push(todayStr);
            saveHabits();
        }

        function deleteHabit(id) {
            habits = habits.filter(item => item.id !== id);
            saveHabits();
        }

        document.getElementById('addForm').addEventListener('submit', event => {
            event.preventDefault();
            const input = document.getElementById('habitInput');
            const title = input.value.trim().slice(0, 60);
            if (!title) return;

            const type = document.getElementById('habitType').value === 'quit' ? 'quit' : 'start';
            habits.push({
                id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                title,
                type,
                icon: type === 'quit' ? '🚫' : '⚡',
                completedDates: []
            });
            input.value = '';
            saveHabits();
            input.focus();
        });

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Habit Tracker PWA</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <style>
        :root {
            --bg-black: #000000;
            --card-cyan: #00f0ff;
            --card-purple: #bd00ff;
            --card-pink: #ff007f;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --purple-glow: rgba(189, 0, 255, 0.4);
            --pink-glow: rgba(255, 0, 127, 0.4);
            --text-main: #ffffff;
            --text-dim: #6c7a89;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 15px) 16px 100px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* Top Header Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--card-cyan);
            box-shadow: 0 0 12px var(--cyan-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: rgba(0, 240, 255, 0.1);
        }

        .settings-btn {
            font-size: 1.3rem;
            color: var(--text-dim);
            cursor: pointer;
        }

        /* Dashboard Analytics Card */
        .dashboard-card {
            background: rgba(10, 15, 25, 0.8);
            border: 2px solid var(--card-cyan);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 20px var(--cyan-glow);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ring-container {
            position: relative;
            width: 95px;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 8;
        }

        .ring-progress {
            fill: none;
            stroke: url(#ring-gradient);
            stroke-width: 8;
            stroke-dasharray: 251;
            stroke-dashoffset: 60;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .ring-text {
            position: absolute;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .charts-right {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-end;
        }

        /* Neon Sparkline Graph */
        .line-graph {
            width: 120px;
            height: 35px;
        }

        .line-graph path {
            fill: none;
            stroke: url(#line-gradient);
            stroke-width: 3;
            filter: drop-shadow(0px 0px 4px rgba(189, 0, 255, 0.8));
        }

        /* Neon Mini Bar Chart */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 30px;
        }

        .bar {
            width: 8px;
            border-radius: 4px;
            background: linear-gradient(180deg, var(--card-cyan), var(--card-purple));
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        /* Habit Input Form */
        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-input {
            flex: 1;
            background: rgba(15, 20, 30, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #fff;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            outline: none;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--card-cyan), var(--card-purple));
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        /* Habit Cards List */
        .habits-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .habit-card {
            background: rgba(10, 15, 25, 0.8);
            border-radius: 22px;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        /* Specific Glow Colors matching the image */
        .habit-card.cyan-glow {
            border: 2px solid var(--card-cyan);
            box-shadow: 0 0 16px var(--cyan-glow);
        }

        .habit-card.purple-glow {
            border: 2px solid var(--card-purple);
            box-shadow: 0 0 16px var(--purple-glow);
        }

        .habit-card.pink-glow {
            border: 2px solid var(--card-pink);
            box-shadow: 0 0 16px var(--pink-glow);
        }

        .habit-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .cyan-glow .icon-box { border: 1px solid var(--card-cyan); color: var(--card-cyan); }
        .purple-glow .icon-box { border: 1px solid var(--card-purple); color: var(--card-purple); }
        .pink-glow .icon-box { border: 1px solid var(--card-pink); color: var(--card-pink); }

        .habit-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .habit-name {
            font-size: 1rem;
            font-weight: 700;
        }

        /* Dots Row representing weekly progress */
        .dots-row {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .dot.active-cyan { background: var(--card-cyan); box-shadow: 0 0 6px var(--card-cyan); }
        .dot.active-purple { background: var(--card-purple); box-shadow: 0 0 6px var(--card-purple); }
        .dot.active-pink { background: var(--card-pink); box-shadow: 0 0 6px var(--card-pink); }

        .habit-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Glowing Checkmark Button */
        .check-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.3);
            background: rgba(10, 15, 25, 0.8);
            color: transparent;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .check-btn.checked {
            background: linear-gradient(135deg, var(--card-cyan), var(--card-purple));
            border-color: var(--card-cyan);
            color: #fff;
            box-shadow: 0 0 14px var(--cyan-glow);
        }

        .delete-btn {
            border: 0;
            background: transparent;
            color: var(--text-dim);
            font-size: 1.2rem;
            padding: 8px;
            cursor: pointer;
        }

        .delete-btn:hover {
            color: var(--card-pink);
        }

        .empty-state {
            color: var(--text-dim);
            text-align: center;
            padding: 32px 12px;
        }

        .dashboard-copy {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dashboard-copy strong {
            font-size: 1rem;
        }

        .dashboard-copy span {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        @media (max-width: 360px) {
            .dashboard-card {
                padding: 16px;
            }

            .ring-container {
                width: 82px;
                height: 82px;
            }

            .line-graph {
                width: 90px;
            }
        }
    </style>
</head>
<body>
    <header class="top-nav">
        <h1>Habits</h1>
        <div class="avatar-btn" aria-hidden="true">✨</div>
    </header>

    <section class="dashboard-card" aria-label="Today's progress">
        <div class="ring-container">
            <svg class="ring-svg" viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                    <linearGradient id="ring-gradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#bd00ff" />
                    </linearGradient>
                    <linearGradient id="line-gradient" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#bd00ff" />
                    </linearGradient>
                </defs>
                <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
                <circle class="ring-progress" id="progressRing" cx="50" cy="50" r="40"></circle>
            </svg>
            <span class="ring-text" id="progressText">0%</span>
        </div>
        <div class="dashboard-copy">
            <strong id="dateText"></strong>
            <span>Daily progress</span>
        </div>
        <div class="charts-right" aria-hidden="true">
            <svg class="line-graph" viewBox="0 0 120 35">
                <path id="trendLine" d="M2 28 L22 22 L42 25 L62 12 L82 18 L102 7 L118 10"></path>
            </svg>
            <div class="bar-chart" id="weekBars"></div>
        </div>
    </section>

    <form class="add-form" id="addForm">
        <input class="add-input" id="habitInput" type="text" maxlength="80"
            placeholder="Add a habit..." aria-label="New habit" required>
        <button class="add-btn" type="submit">Add</button>
    </form>

    <main class="habits-list" id="habitsList" aria-live="polite"></main>

    <script>
        const STORAGE_KEY = 'my_habits_v2';
        const today = localDateString(new Date());
        const habitsList = document.getElementById('habitsList');
        let habits = loadHabits();

        function localDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function loadHabits() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                if (!Array.isArray(saved)) return [];
                return saved.filter(item => item && typeof item === 'object')
                    .map((item, index) => ({
                        id: String(item.id || `habit-${index}-${Date.now()}`),
                        name: String(item.name || item.title || '').trim(),
                        completedDates: Array.isArray(item.completedDates)
                            ? item.completedDates.filter(date => typeof date === 'string')
                            : [],
                        color: ['cyan', 'purple', 'pink'].includes(item.color)
                            ? item.color
                            : (item.type === 'quit' ? 'pink' : ['cyan', 'purple', 'pink'][index % 3]),
                        icon: typeof item.icon === 'string' ? item.icon : (item.type === 'quit' ? '✦' : '⚡')
                    }))
                    .filter(item => item.name);
            } catch (error) {
                console.error('Could not load saved habits:', error);
                return [];
            }
        }

        function saveHabits() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
            } catch (error) {
                console.error('Could not save habits:', error);
                alert('Your habits could not be saved in this browser.');
            }
            render();
        }

        function render() {
            habitsList.replaceChildren();
            if (habits.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'empty-state';
                empty.textContent = 'No habits yet. Add one above to get started.';
                habitsList.append(empty);
            }

            habits.forEach(habit => {
                const color = ['cyan', 'purple', 'pink'].includes(habit.color) ? habit.color : 'cyan';
                const card = document.createElement('article');
                card.className = `habit-card ${color}-glow`;

                const left = document.createElement('div');
                left.className = 'habit-left';
                const icon = document.createElement('span');
                icon.className = 'icon-box';
                icon.setAttribute('aria-hidden', 'true');
                icon.textContent = habit.icon;
                const details = document.createElement('div');
                details.className = 'habit-details';
                const name = document.createElement('span');
                name.className = 'habit-name';
                name.textContent = habit.name;
                const dots = document.createElement('div');
                dots.className = 'dots-row';
                dots.setAttribute('aria-label', 'Last seven days');

                for (let daysAgo = 6; daysAgo >= 0; daysAgo -= 1) {
                    const date = new Date();
                    date.setDate(date.getDate() - daysAgo);
                    const dot = document.createElement('span');
                    dot.className = `dot${habit.completedDates.includes(localDateString(date)) ? ` active-${color}` : ''}`;
                    dots.append(dot);
                }

                details.append(name, dots);
                left.append(icon, details);

                const right = document.createElement('div');
                right.className = 'habit-right';
                const isDone = habit.completedDates.includes(today);
                const check = document.createElement('button');
                check.className = `check-btn${isDone ? ' checked' : ''}`;
                check.type = 'button';
                check.textContent = isDone ? '✓' : '';
                check.setAttribute('aria-label', `Mark ${habit.name} ${isDone ? 'incomplete' : 'complete'} today`);
                check.addEventListener('click', () => toggleHabit(habit.id));

                const remove = document.createElement('button');
                remove.className = 'delete-btn';
                remove.type = 'button';
                remove.textContent = '×';
                remove.setAttribute('aria-label', `Delete ${habit.name}`);
                remove.addEventListener('click', () => deleteHabit(habit.id));

                right.append(check, remove);
                card.append(left, right);
                habitsList.append(card);
            });

            updateDashboard();
        }

        function updateDashboard() {
            const completed = habits.filter(habit => habit.completedDates.includes(today)).length;
            const percentage = habits.length ? Math.round((completed / habits.length) * 100) : 0;
            document.getElementById('progressText').textContent = `${percentage}%`;
            document.getElementById('progressRing').style.strokeDashoffset = String(251 - (251 * percentage / 100));
            document.getElementById('dateText').textContent = new Date().toLocaleDateString(undefined, {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });

            const bars = document.getElementById('weekBars');
            bars.replaceChildren();
            for (let daysAgo = 6; daysAgo >= 0; daysAgo -= 1) {
                const date = new Date();
                date.setDate(date.getDate() - daysAgo);
                const dateString = localDateString(date);
                const count = habits.filter(habit => habit.completedDates.includes(dateString)).length;
                const bar = document.createElement('span');
                bar.className = 'bar';
                bar.style.height = `${Math.max(4, habits.length ? Math.round((count / habits.length) * 30) : 4)}px`;
                bars.append(bar);
            }
        }

        function toggleHabit(id) {
            const habit = habits.find(item => item.id === id);
            if (!habit) return;
            const index = habit.completedDates.indexOf(today);
            if (index >= 0) habit.completedDates.splice(index, 1);
            else habit.completedDates.push(today);
            saveHabits();
        }

        function deleteHabit(id) {
            habits = habits.filter(item => item.id !== id);
            saveHabits();
        }

        document.getElementById('addForm').addEventListener('submit', event => {
            event.preventDefault();
            const input = document.getElementById('habitInput');
            const name = input.value.trim();
            if (!name) return;
            habits.push({
                id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                name,
                completedDates: [],
                color: ['cyan', 'purple', 'pink'][habits.length % 3],
                icon: '⚡'
            });
            input.value = '';
            saveHabits();
            input.focus();
        });

        render();
    </script>
</body>
</html>

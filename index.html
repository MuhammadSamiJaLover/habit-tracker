<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Habit Tracker PWA</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050811">
    
    <style>
        :root {
            --bg-black: #050811;
            --card-cyan: #00f0ff;
            --card-green: #00ff66;
            --card-pink: #ff007f;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --green-glow: rgba(0, 255, 102, 0.35);
            --pink-glow: rgba(255, 0, 127, 0.35);
            --text-main: #ffffff;
            --text-dim: #708090;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 10px) 12px 85px;
            max-width: 440px;
            margin: 0 auto;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Dashboard Header */
        .dashboard-header {
            background: rgba(10, 16, 28, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: 0 0 10px var(--cyan-glow);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ring-box {
            position: relative;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 6; }
        .ring-progress {
            fill: none;
            stroke: url(#cyan-green-grad);
            stroke-width: 6;
            stroke-dasharray: 157;
            stroke-dashoffset: 157;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease;
        }

        .ring-percent {
            position: absolute;
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--card-cyan);
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .header-label {
            font-size: 0.6rem;
            color: var(--text-dim);
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .week-days {
            display: flex;
            gap: 6px;
            font-size: 0.6rem;
            color: var(--text-dim);
            font-weight: 800;
        }

        .section-title-sub {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 8px 0 4px 2px;
        }
        .title-start { color: var(--card-cyan); }
        .title-quit { color: var(--card-pink); }

        .add-form {
            background: rgba(10, 16, 28, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            padding: 6px 8px;
            margin-bottom: 10px;
            display: flex;
            gap: 6px;
        }

        .add-input {
            flex: 1;
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            outline: none;
        }

        .add-select {
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            outline: none;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--card-cyan), var(--card-green));
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.7rem;
            padding: 6px 0;
        }

        .habit-row {
            background: rgba(10, 16, 28, 0.85);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            min-height: 38px;
        }

        .row-start { border: 1px solid rgba(0, 240, 255, 0.25); }
        .row-start.done { border-color: var(--card-green); box-shadow: 0 0 6px var(--green-glow); }
        .row-start.failed { border-color: var(--card-pink); box-shadow: 0 0 6px var(--pink-glow); }

        .row-quit { border: 1px solid rgba(255, 0, 127, 0.25); }
        .row-quit.done { border-color: var(--card-green); box-shadow: 0 0 6px var(--green-glow); }

        .habit-info {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .streak-pill-sm {
            font-size: 0.6rem;
            color: var(--text-dim);
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            padding: 1px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .compact-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-pass-sm {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--card-green);
            color: var(--card-green);
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-pass-sm.active {
            background: var(--card-green);
            color: #000;
            box-shadow: 0 0 6px var(--green-glow);
        }

        .btn-fail-sm {
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--card-pink);
            color: var(--card-pink);
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-fail-sm.active {
            background: var(--card-pink);
            color: #fff;
            box-shadow: 0 0 6px var(--pink-glow);
        }

        .btn-del {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0 2px;
        }

        /* CALENDAR STYLES */
        .cal-card {
            background: rgba(10, 16, 28, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 14px;
            padding: 12px;
        }

        .cal-select {
            width: 100%;
            background: rgba(5, 8, 17, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--card-cyan);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            outline: none;
            margin-bottom: 12px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .cal-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 2px;
        }

        .cal-date-num {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-dim);
            line-height: 1;
        }

        .cal-mark {
            font-size: 0.75rem;
            font-weight: 900;
            margin-top: 2px;
            line-height: 1;
        }

        .cal-cell.pass {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--card-green);
        }
        .cal-cell.pass .cal-mark, .cal-cell.pass .cal-date-num { color: var(--card-green); }

        .cal-cell.fail {
            background: rgba(255, 0, 127, 0.15);
            border-color: var(--card-pink);
        }
        .cal-cell.fail .cal-mark, .cal-cell.fail .cal-date-num { color: var(--card-pink); }

        .cal-cell.today {
            border-color: var(--card-cyan);
            box-shadow: 0 0 6px var(--cyan-glow);
        }

        .cal-legend {
            display: flex;
            justify-content: space-around;
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 12px;
            font-weight: 700;
        }

        /* Nav Dock */
        .nav-dock {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 10px);
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            background: rgba(10, 16, 28, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
        }

        .dock-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.6rem;
            font-weight: 800;
            cursor: pointer;
        }

        .dock-btn.active { color: var(--card-cyan); }
        .dock-icon { font-size: 1rem; }
    </style>
</head>
<body>

    <!-- TAB 1: DASHBOARD -->
    <div id="dashboardView" class="view-section active">
        <div class="dashboard-header">
            <div class="ring-box">
                <svg class="ring-svg">
                    <defs>
                        <linearGradient id="cyan-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f0ff" />
                            <stop offset="100%" stop-color="#00ff66" />
                        </linearGradient>
                    </defs>
                    <circle class="ring-bg" cx="27.5" cy="27.5" r="25" />
                    <circle class="ring-progress" id="ringProgress" cx="27.5" cy="27.5" r="25" />
                </svg>
                <div class="ring-percent" id="ringPercent">0%</div>
            </div>

            <div class="header-right">
                <div class="header-label">DAILY PULSE</div>
                <div class="week-days">
                    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                </div>
            </div>
        </div>

        <div class="add-form">
            <input type="text" id="habitInput" class="add-input" placeholder="New Habit Name" />
            <select id="habitType" class="add-select">
                <option value="start">START</option>
                <option value="quit">QUIT</option>
            </select>
            <button class="add-btn" onclick="addHabit()">+ ADD</button>
        </div>

        <div class="section-title-sub title-start">START (Building)</div>
        <div class="list-container" id="startContainer"></div>

        <div class="section-title-sub title-quit">QUIT (Breaking)</div>
        <div class="list-container" id="quitContainer"></div>
    </div>

    <!-- TAB 2: CALENDAR LOG -->
    <div id="calendarView" class="view-section">
        <div class="cal-card">
            <select id="calHabitSelect" class="cal-select" onchange="renderCalendar()"></select>

            <div class="cal-grid" id="calGrid"></div>

            <div class="cal-legend">
                <span style="color: var(--card-green)">✓ PASS (Adds Streak)</span>
                <span style="color: var(--card-pink)">✕ FAIL (Resets Streak)</span>
            </div>
        </div>
    </div>

    <!-- Floating Dock Nav -->
    <div class="nav-dock">
        <button class="dock-btn active" id="btnDash" onclick="switchTab('dashboard')">
            <span class="dock-icon">🏠</span>
            <span>Dashboard</span>
        </button>
        <button class="dock-btn" id="btnCal" onclick="switchTab('calendar')">
            <span class="dock-icon">📅</span>
            <span>Calendar</span>
        </button>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('cyber_habits_custom')) || [];

        function getISO(d) { return d.toISOString().split('T')[0]; }
        const todayStr = getISO(new Date());

        function sanitizeData() {
            habits.forEach(h => {
                if (!h.completedDates) h.completedDates = [];
                if (!h.failedDates) h.failedDates = [];
                if (h.streak === undefined) h.streak = h.completedDates.length || 0;
            });
        }
        sanitizeData();

        function saveHabits() {
            localStorage.setItem('cyber_habits_custom', JSON.stringify(habits));
            render();
            renderCalendar();
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const type = document.getElementById('habitType').value;
            const title = input.value.trim().toUpperCase();
            if (!title) return;

            habits.push({
                id: Date.now().toString(),
                title: title,
                type: type,
                streak: 0,
                completedDates: [],
                failedDates: []
            });

            input.value = '';
            saveHabits();
        }

        // Action helper for PASS vs FAIL button clicks
        function setStatus(id, dateStr, status) {
            const h = habits.find(item => item.id === id);
            if (!h) return;

            const pIdx = h.completedDates.indexOf(dateStr);
            const fIdx = h.failedDates.indexOf(dateStr);

            if (status === 'pass') {
                if (pIdx > -1) h.completedDates.splice(pIdx, 1);
                else {
                    h.completedDates.push(dateStr);
                    if (fIdx > -1) h.failedDates.splice(fIdx, 1);
                }
            } else if (status === 'fail') {
                if (fIdx > -1) h.failedDates.splice(fIdx, 1);
                else {
                    h.failedDates.push(dateStr);
                    if (pIdx > -1) h.completedDates.splice(pIdx, 1);
                }
            }

            h.streak = h.completedDates.length;
            saveHabits();
        }

        // Calendar Tap Handler: Cycles Untracked -> PASS (✓) -> FAIL (✕) -> Untracked
        function cycleCalendarDay(id, dateStr) {
            const h = habits.find(item => item.id === id);
            if (!h) return;

            const isPass = h.completedDates.includes(dateStr);
            const isFail = h.failedDates.includes(dateStr);

            if (!isPass && !isFail) {
                // Untracked -> PASS
                h.completedDates.push(dateStr);
            } else if (isPass) {
                // PASS -> FAIL
                h.completedDates.splice(h.completedDates.indexOf(dateStr), 1);
                h.failedDates.push(dateStr);
            } else if (isFail) {
                // FAIL -> Untracked
                h.failedDates.splice(h.failedDates.indexOf(dateStr), 1);
            }

            h.streak = h.completedDates.length;
            saveHabits();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveHabits();
        }

        function switchTab(tab) {
            document.getElementById('dashboardView').classList.toggle('active', tab === 'dashboard');
            document.getElementById('calendarView').classList.toggle('active', tab === 'calendar');
            document.getElementById('btnDash').classList.toggle('active', tab === 'dashboard');
            document.getElementById('btnCal').classList.toggle('active', tab === 'calendar');

            if (tab === 'calendar') populateCalSelect();
        }

        function render() {
            const startContainer = document.getElementById('startContainer');
            const quitContainer = document.getElementById('quitContainer');

            const completedToday = habits.filter(h => h.completedDates.includes(todayStr)).length;
            const percent = habits.length > 0 ? Math.round((completedToday / habits.length) * 100) : 0;

            document.getElementById('ringPercent').textContent = `${percent}%`;
            const offset = 157 - (157 * percent) / 100;
            document.getElementById('ringProgress').style.strokeDashoffset = offset;

            startContainer.innerHTML = renderGroup(habits.filter(h => h.type === 'start'), 'No START habits added.');
            quitContainer.innerHTML = renderGroup(habits.filter(h => h.type === 'quit'), 'No QUIT habits added.');
        }

        function renderGroup(group, emptyMsgText) {
            if (group.length === 0) return `<div class="empty-msg">${emptyMsgText}</div>`;

            return group.map(h => {
                const isPass = h.completedDates.includes(todayStr);
                const isFail = h.failedDates.includes(todayStr);

                let stateClass = '';
                if (isPass) stateClass = 'done';
                else if (isFail) stateClass = 'failed';

                const theme = h.type === 'start' ? `row-start ${stateClass}` : `row-quit ${stateClass}`;

                return `
                    <div class="habit-row ${theme}">
                        <div class="habit-info">
                            <span class="card-title">${h.title}</span>
                            <span class="streak-pill-sm">🔥 ${h.streak || 0}</span>
                        </div>
                        <div class="compact-actions">
                            <button class="btn-pass-sm ${isPass ? 'active' : ''}" onclick="setStatus('${h.id}', '${todayStr}', 'pass')">✓ PASS</button>
                            <button class="btn-fail-sm ${isFail ? 'active' : ''}" onclick="setStatus('${h.id}', '${todayStr}', 'fail')">✕ FAIL</button>
                            <button class="btn-del" onclick="deleteHabit('${h.id}')">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function populateCalSelect() {
            const select = document.getElementById('calHabitSelect');
            if (habits.length === 0) {
                select.innerHTML = '<option>No habits available</option>';
                renderCalendar();
                return;
            }
            select.innerHTML = habits.map(h => `<option value="${h.id}">${h.title} (${h.type.toUpperCase()})</option>`).join('');
            renderCalendar();
        }

        function renderCalendar() {
            const calGrid = document.getElementById('calGrid');
            const select = document.getElementById('calHabitSelect');
            if (!select.value || habits.length === 0) {
                calGrid.innerHTML = '<div style="grid-column: span 7; text-align:center; padding:15px; font-size:0.7rem; color:var(--text-dim)">Add a habit to view calendar history.</div>';
                return;
            }

            const habit = habits.find(h => h.id === select.value);
            if (!habit) return;

            const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
            let html = days.map(d => `<div class="cal-day-name">${d}</div>`).join('');

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let day = 1; day <= totalDays; day++) {
                const dateObj = new Date(year, month, day);
                const dStr = getISO(dateObj);
                const isPass = habit.completedDates.includes(dStr);
                const isFail = habit.failedDates.includes(dStr);
                const isToday = dStr === todayStr;

                let cellClass = 'cal-cell';
                let mark = '';

                if (isPass) { cellClass += ' pass'; mark = '✓'; }
                else if (isFail) { cellClass += ' fail'; mark = '✕'; }
                if (isToday) cellClass += ' today';

                html += `
                    <div class="${cellClass}" onclick="cycleCalendarDay('${habit.id}', '${dStr}')">
                        <span class="cal-date-num">${day}</span>
                        <span class="cal-mark">${mark}</span>
                    </div>
                `;
            }

            calGrid.innerHTML = html;
        }

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Habit Tracker PWA</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0406">
    
    <style>
        :root {
            --bg-black: #0a0406;
            --card-yellow: #ffd60a;
            --card-red: #ff2a55;
            --card-green: #00ff66;
            --yellow-glow: rgba(255, 214, 10, 0.35);
            --red-glow: rgba(255, 42, 85, 0.35);
            --green-glow: rgba(0, 255, 102, 0.35);
            --text-main: #ffffff;
            --text-dim: #8c7a7e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 42, 85, 0.14) 0%, rgba(255, 214, 10, 0.05) 45%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 10px) 12px 90px;
            max-width: 440px;
            margin: 0 auto;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Dashboard Header */
        .dashboard-header {
            background: rgba(22, 10, 14, 0.88);
            border: 1px solid rgba(255, 214, 10, 0.35);
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: 0 0 12px var(--red-glow);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ring-box {
            position: relative;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 6; }
        .ring-progress {
            fill: none;
            stroke: url(#red-yellow-grad);
            stroke-width: 6;
            stroke-dasharray: 157;
            stroke-dashoffset: 157;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease;
        }

        .ring-percent {
            position: absolute;
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--card-yellow);
            text-shadow: 0 0 8px var(--yellow-glow);
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .header-label {
            font-size: 0.6rem;
            color: var(--card-yellow);
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .week-days {
            display: flex;
            gap: 5px;
            font-size: 0.6rem;
            color: var(--text-dim);
            font-weight: 800;
        }

        .week-days span.today-day {
            color: var(--card-yellow);
            background: rgba(255, 214, 10, 0.15);
            border: 1px solid var(--card-yellow);
            padding: 0 4px;
            border-radius: 4px;
        }

        .section-title-sub {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 8px 0 4px 2px;
        }
        .title-start { color: var(--card-yellow); text-shadow: 0 0 6px var(--yellow-glow); }
        .title-quit { color: var(--card-red); text-shadow: 0 0 6px var(--red-glow); }

        .add-form {
            background: rgba(22, 10, 14, 0.85);
            border: 1px solid rgba(255, 42, 85, 0.35);
            border-radius: 12px;
            padding: 6px 8px;
            margin-bottom: 10px;
            display: flex;
            gap: 6px;
        }

        .add-input {
            flex: 1;
            background: rgba(10, 4, 6, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            outline: none;
        }

        .add-select {
            background: rgba(10, 4, 6, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--card-yellow);
            padding: 6px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            outline: none;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--card-yellow), var(--card-red));
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.7rem;
            padding: 6px 0;
        }

        .habit-row {
            background: rgba(22, 10, 14, 0.88);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            min-height: 38px;
        }

        .row-start { border: 1px solid rgba(255, 214, 10, 0.3); }
        .row-start.done { border-color: var(--card-green); box-shadow: 0 0 6px var(--green-glow); }
        .row-start.failed { border-color: var(--card-red); box-shadow: 0 0 6px var(--red-glow); }

        .row-quit { border: 1px solid rgba(255, 42, 85, 0.35); }
        .row-quit.done { border-color: var(--card-green); box-shadow: 0 0 6px var(--green-glow); }

        .habit-info {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .streak-pill-sm {
            font-size: 0.6rem;
            color: var(--card-yellow);
            font-weight: 800;
            background: rgba(255, 214, 10, 0.1);
            padding: 1px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .compact-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-pass-sm {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--card-green);
            color: var(--card-green);
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-pass-sm.active {
            background: var(--card-green);
            color: #000;
            box-shadow: 0 0 6px var(--green-glow);
        }

        .btn-fail-sm {
            background: rgba(255, 42, 85, 0.12);
            border: 1px solid var(--card-red);
            color: var(--card-red);
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-fail-sm.active {
            background: var(--card-red);
            color: #fff;
            box-shadow: 0 0 6px var(--red-glow);
        }

        .btn-del {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0 2px;
        }

        /* STICKY CALENDAR HEADER BAR */
        .cal-sticky-bar {
            position: sticky;
            top: calc(env(safe-area-inset-top) + 4px);
            z-index: 90;
            background: rgba(22, 10, 14, 0.96);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 214, 10, 0.45);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.85), 0 0 10px var(--red-glow);
        }

        .cal-switcher-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .habit-cycle-btn {
            background: rgba(255, 214, 10, 0.15);
            border: 1px solid rgba(255, 214, 10, 0.4);
            color: var(--card-yellow);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: pointer;
        }

        .cal-select {
            flex: 1;
            background: rgba(10, 4, 6, 0.95);
            border: 1px solid rgba(255, 42, 85, 0.45);
            color: var(--card-yellow);
            padding: 7px 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 800;
            outline: none;
        }

        .cal-sub-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.6rem;
            font-weight: 800;
        }

        .calendar-year-nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .calendar-year-nav button {
            background: rgba(255, 214, 10, 0.12);
            border: 1px solid rgba(255, 214, 10, 0.35);
            border-radius: 5px;
            color: var(--card-yellow);
            padding: 1px 7px;
            font-size: 0.8rem;
            font-weight: 900;
            cursor: pointer;
        }

        .calendar-year-nav strong {
            color: var(--card-yellow);
            font-size: 0.72rem;
        }

        .cal-legend {
            display: flex;
            gap: 8px;
        }

        /* CALENDAR GRID */
        .cal-card {
            background: rgba(22, 10, 14, 0.88);
            border: 1px solid rgba(255, 214, 10, 0.25);
            border-radius: 14px;
            padding: 10px;
        }

        .year-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .month-card {
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: rgba(10, 4, 6, 0.55);
            scroll-margin-top: 95px;
        }

        .month-card.current-month {
            border-color: rgba(255, 214, 10, 0.45);
            box-shadow: 0 0 10px rgba(255, 214, 10, 0.12);
        }

        .month-title {
            margin-bottom: 8px;
            color: var(--card-yellow);
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .cal-empty {
            aspect-ratio: 1;
        }

        .cal-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 7px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 2px;
        }

        .cal-date-num {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-dim);
            line-height: 1;
        }

        .cal-mark {
            font-size: 0.7rem;
            font-weight: 900;
            margin-top: 2px;
            line-height: 1;
        }

        .cal-cell.pass {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--card-green);
        }
        .cal-cell.pass .cal-mark, .cal-cell.pass .cal-date-num { color: var(--card-green); }

        .cal-cell.fail {
            background: rgba(255, 42, 85, 0.18);
            border-color: var(--card-red);
        }
        .cal-cell.fail .cal-mark, .cal-cell.fail .cal-date-num { color: var(--card-red); }

        .cal-cell.today {
            border: 1.5px solid var(--card-yellow);
            box-shadow: 0 0 8px var(--yellow-glow);
        }
        .cal-cell.today .cal-date-num {
            color: var(--card-yellow);
        }

        /* Nav Dock */
        .nav-dock {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 10px);
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            background: rgba(22, 10, 14, 0.94);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 214, 10, 0.4);
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
            z-index: 100;
        }

        .dock-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.6rem;
            font-weight: 800;
            cursor: pointer;
        }

        .dock-btn.active { color: var(--card-yellow); text-shadow: 0 0 6px var(--yellow-glow); }
        .dock-icon { font-size: 1rem; }
    </style>
</head>
<body>

    <!-- TAB 1: DASHBOARD -->
    <div id="dashboardView" class="view-section active">
        <div class="dashboard-header">
            <div class="ring-box">
                <svg class="ring-svg">
                    <defs>
                        <linearGradient id="red-yellow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff2a55" />
                            <stop offset="100%" stop-color="#ffd60a" />
                        </linearGradient>
                    </defs>
                    <circle class="ring-bg" cx="27.5" cy="27.5" r="25" />
                    <circle class="ring-progress" id="ringProgress" cx="27.5" cy="27.5" r="25" />
                </svg>
                <div class="ring-percent" id="ringPercent">0%</div>
            </div>

            <div class="header-right">
                <div class="header-label" id="todayHeaderLabel">DAILY PULSE</div>
                <div class="week-days" id="weekDays"></div>
            </div>
        </div>

        <div class="add-form">
            <input type="text" id="habitInput" class="add-input" placeholder="New Habit Name" />
            <select id="habitType" class="add-select">
                <option value="start">START</option>
                <option value="quit">QUIT</option>
            </select>
            <button class="add-btn" onclick="addHabit()">+ ADD</button>
        </div>

        <div class="section-title-sub title-start">START (Building)</div>
        <div class="list-container" id="startContainer"></div>

        <div class="section-title-sub title-quit">QUIT (Breaking)</div>
        <div class="list-container" id="quitContainer"></div>
    </div>

    <!-- TAB 2: CALENDAR LOG -->
    <div id="calendarView" class="view-section">
        <!-- Sticky Floating Habit & Year Bar -->
        <div class="cal-sticky-bar">
            <div class="cal-switcher-row">
                <button type="button" class="habit-cycle-btn" onclick="cycleCalHabit(-1)">‹</button>
                <select id="calHabitSelect" class="cal-select" onchange="renderCalendar(false)"></select>
                <button type="button" class="habit-cycle-btn" onclick="cycleCalHabit(1)">›</button>
            </div>

            <div class="cal-sub-bar">
                <div class="calendar-year-nav">
                    <button type="button" onclick="changeCalendarYear(-1)">‹</button>
                    <strong id="calendarYear"></strong>
                    <button type="button" onclick="changeCalendarYear(1)">›</button>
                </div>

                <div class="cal-legend">
                    <span style="color: var(--card-green)">✓ PASS</span>
                    <span style="color: var(--card-red)">✕ FAIL</span>
                </div>
            </div>
        </div>

        <div class="cal-card">
            <div class="year-grid" id="calGrid"></div>
        </div>
    </div>

    <!-- Floating Dock Nav -->
    <div class="nav-dock">
        <button class="dock-btn active" id="btnDash" onclick="switchTab('dashboard')">
            <span class="dock-icon">🏠</span>
            <span>Dashboard</span>
        </button>
        <button class="dock-btn" id="btnCal" onclick="switchTab('calendar')">
            <span class="dock-icon">📅</span>
            <span>Calendar</span>
        </button>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('cyber_habits_custom')) || [];
        let calendarYear = new Date().getFullYear();

        function getISO(d = new Date()) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function sanitizeData() {
            habits.forEach(h => {
                if (!h.completedDates) h.completedDates = [];
                if (!h.failedDates) h.failedDates = [];
                if (h.streak === undefined) h.streak = h.completedDates.length || 0;
            });
        }
        sanitizeData();

        function saveHabits() {
            localStorage.setItem('cyber_habits_custom', JSON.stringify(habits));
            render();
            renderCalendar(false);
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const type = document.getElementById('habitType').value;
            const title = input.value.trim().toUpperCase();
            if (!title) return;

            habits.push({
                id: Date.now().toString(),
                title: title,
                type: type,
                streak: 0,
                completedDates: [],
                failedDates: []
            });

            input.value = '';
            saveHabits();
        }

        function setStatusToday(id, status) {
            const todayStr = getISO();
            const h = habits.find(item => item.id === id);
            if (!h) return;

            const pIdx = h.completedDates.indexOf(todayStr);
            const fIdx = h.failedDates.indexOf(todayStr);

            if (status === 'pass') {
                if (pIdx > -1) h.completedDates.splice(pIdx, 1);
                else {
                    h.completedDates.push(todayStr);
                    if (fIdx > -1) h.failedDates.splice(fIdx, 1);
                }
            } else if (status === 'fail') {
                if (fIdx > -1) h.failedDates.splice(fIdx, 1);
                else {
                    h.failedDates.push(todayStr);
                    if (pIdx > -1) h.completedDates.splice(pIdx, 1);
                }
            }

            h.streak = h.completedDates.length;
            saveHabits();
        }

        function cycleCalendarDay(id, dateStr) {
            if (!id) return;
            const h = habits.find(item => item.id === id);
            if (!h) return;

            const isPass = h.completedDates.includes(dateStr);
            const isFail = h.failedDates.includes(dateStr);

            if (!isPass && !isFail) {
                h.completedDates.push(dateStr);
            } else if (isPass) {
                h.completedDates.splice(h.completedDates.indexOf(dateStr), 1);
                h.failedDates.push(dateStr);
            } else if (isFail) {
                h.failedDates.splice(h.failedDates.indexOf(dateStr), 1);
            }

            h.streak = h.completedDates.length;
            saveHabits();
        }

        function cycleCalHabit(dir) {
            if (habits.length <= 1) return;
            const select = document.getElementById('calHabitSelect');
            const idx = habits.findIndex(h => h.id === select.value);
            const nextIdx = (idx + dir + habits.length) % habits.length;
            select.value = habits[nextIdx].id;
            renderCalendar(false);
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveHabits();
        }

        function switchTab(tab) {
            document.getElementById('dashboardView').classList.toggle('active', tab === 'dashboard');
            document.getElementById('calendarView').classList.toggle('active', tab === 'calendar');
            document.getElementById('btnDash').classList.toggle('active', tab === 'dashboard');
            document.getElementById('btnCal').classList.toggle('active', tab === 'calendar');

            if (tab === 'calendar') {
                populateCalSelect(true);
            } else {
                render();
            }
        }

        function render() {
            const now = new Date();
            const todayStr = getISO(now);
            const startContainer = document.getElementById('startContainer');
            const quitContainer = document.getElementById('quitContainer');

            document.getElementById('todayHeaderLabel').textContent = now.toLocaleDateString('en-US', {
                weekday: 'short', month: 'short', day: 'numeric'
            }).toUpperCase();

            const mondayFirstToday = (now.getDay() + 6) % 7;
            const weekDays = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
            document.getElementById('weekDays').innerHTML = weekDays
                .map((day, index) => `<span class="${index === mondayFirstToday ? 'today-day' : ''}">${day}</span>`)
                .join('');

            const completedToday = habits.filter(h => h.completedDates.includes(todayStr)).length;
            const percent = habits.length > 0 ? Math.round((completedToday / habits.length) * 100) : 0;

            document.getElementById('ringPercent').textContent = `${percent}%`;
            const offset = 157 - (157 * percent) / 100;
            document.getElementById('ringProgress').style.strokeDashoffset = offset;

            startContainer.innerHTML = renderGroup(habits.filter(h => h.type === 'start'), 'No START habits added.');
            quitContainer.innerHTML = renderGroup(habits.filter(h => h.type === 'quit'), 'No QUIT habits added.');
        }

        function renderGroup(group, emptyMsgText) {
            if (group.length === 0) return `<div class="empty-msg">${emptyMsgText}</div>`;
            const todayStr = getISO();

            return group.map(h => {
                const isPass = h.completedDates.includes(todayStr);
                const isFail = h.failedDates.includes(todayStr);

                let stateClass = '';
                if (isPass) stateClass = 'done';
                else if (isFail) stateClass = 'failed';

                const theme = h.type === 'start' ? `row-start ${stateClass}` : `row-quit ${stateClass}`;

                return `
                    <div class="habit-row ${theme}">
                        <div class="habit-info">
                            <span class="card-title">${h.title}</span>
                            <span class="streak-pill-sm">🔥 ${h.streak || 0}</span>
                        </div>
                        <div class="compact-actions">
                            <button class="btn-pass-sm ${isPass ? 'active' : ''}" onclick="setStatusToday('${h.id}', 'pass')">✓ PASS</button>
                            <button class="btn-fail-sm ${isFail ? 'active' : ''}" onclick="setStatusToday('${h.id}', 'fail')">✕ FAIL</button>
                            <button class="btn-del" onclick="deleteHabit('${h.id}')">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function populateCalSelect(scrollToCurrent = false) {
            const select = document.getElementById('calHabitSelect');
            if (habits.length === 0) {
                select.innerHTML = '<option value="">Add a habit on Dashboard first</option>';
            } else {
                const currentVal = select.value;
                select.innerHTML = habits.map(h => `<option value="${h.id}">${h.title} (${h.type.toUpperCase()}) • 🔥 ${h.streak || 0}</option>`).join('');
                if (currentVal && habits.some(h => h.id === currentVal)) {
                    select.value = currentVal;
                }
            }
            renderCalendar(scrollToCurrent);
        }

        function renderCalendar(scrollToCurrent = false) {
            const calGrid = document.getElementById('calGrid');
            const select = document.getElementById('calHabitSelect');
            document.getElementById('calendarYear').textContent = calendarYear;

            // Keep dropdown streak badge updated after tapping dates
            if (habits.length > 0 && select.selectedIndex >= 0) {
                const activeH = habits.find(h => h.id === select.value);
                if (activeH) {
                    select.options[select.selectedIndex].text = `${activeH.title} (${activeH.type.toUpperCase()}) • 🔥 ${activeH.streak || 0}`;
                }
            }

            const habit = habits.find(h => h.id === select.value) || null;
            const now = new Date();
            const todayStr = getISO(now);
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            const weekdays = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
            let html = '';

            for (let month = 0; month < 12; month++) {
                const firstDay = new Date(calendarYear, month, 1);
                const monthName = firstDay.toLocaleString('en-US', { month: 'long' });
                const offset = (firstDay.getDay() + 6) % 7;
                const totalDays = new Date(calendarYear, month + 1, 0).getDate();
                const isCurrentMonth = (calendarYear === currentYear && month === currentMonth);

                html += `<section class="month-card ${isCurrentMonth ? 'current-month' : ''}" id="month-${month}"><h3 class="month-title">${monthName} ${calendarYear}</h3><div class="month-grid">`;
                html += weekdays.map(day => `<div class="cal-day-name">${day}</div>`).join('');
                html += '<span class="cal-empty"></span>'.repeat(offset);

                for (let day = 1; day <= totalDays; day++) {
                    const dateStr = getISO(new Date(calendarYear, month, day));
                    const isPass = habit ? habit.completedDates.includes(dateStr) : false;
                    const isFail = habit ? habit.failedDates.includes(dateStr) : false;
                    const isToday = dateStr === todayStr;

                    let cellClass = 'cal-cell';
                    let mark = '';

                    if (isPass) { cellClass += ' pass'; mark = '✓'; }
                    else if (isFail) { cellClass += ' fail'; mark = '✕'; }
                    if (isToday) cellClass += ' today';

                    const clickAttr = habit ? `onclick="cycleCalendarDay('${habit.id}', '${dateStr}')"` : '';

                    html += `
                        <div class="${cellClass}" ${clickAttr}>
                            <span class="cal-date-num">${day}</span>
                            <span class="cal-mark">${mark}</span>
                        </div>
                    `;
                }

                html += '</div></section>';
            }

            calGrid.innerHTML = html;

            if (scrollToCurrent && calendarYear === currentYear) {
                const target = document.getElementById(`month-${currentMonth}`);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function changeCalendarYear(offset) {
            calendarYear += offset;
            renderCalendar(false);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                render();
                if (document.getElementById('calendarView').classList.contains('active')) {
                    renderCalendar(false);
                }
            }
        });

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Habit Tracker PWA</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050811">
    
    <style>
        :root {
            --bg-black: #050811;
            --card-cyan: #00f0ff;
            --card-green: #00ff66;
            --card-pink: #ff007f;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --green-glow: rgba(0, 255, 102, 0.35);
            --pink-glow: rgba(255, 0, 127, 0.35);
            --text-main: #ffffff;
            --text-dim: #708090;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 15px) 16px 110px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* Dashboard Analytics Header */
        .dashboard-header {
            background: rgba(10, 16, 28, 0.85);
            border: 1.5px solid rgba(0, 240, 255, 0.4);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 0 20px var(--cyan-glow);
            margin-bottom: 22px;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 15px;
            align-items: center;
        }

        .ring-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 7;
        }

        .ring-progress {
            fill: none;
            stroke: url(#cyan-green-grad);
            stroke-width: 7;
            stroke-dasharray: 264;
            stroke-dashoffset: 264;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .ring-info {
            position: absolute;
            text-align: center;
        }

        .ring-percent {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--card-cyan);
            text-shadow: 0 0 10px var(--card-cyan);
        }

        .ring-label {
            font-size: 0.55rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            font-weight: 700;
            margin-top: 2px;
        }

        .graph-box {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100px;
        }

        .line-svg {
            width: 100%;
            height: 60px;
        }

        .line-svg path {
            fill: none;
            stroke: var(--card-cyan);
            stroke-width: 2.5;
            filter: drop-shadow(0px 0px 6px var(--card-cyan));
        }

        .week-days {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-dim);
            font-weight: 700;
        }

        /* Section Titles */
        .section-header {
            margin-bottom: 12px;
        }

        .section-title-main {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .section-title-sub {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .title-start { color: var(--card-cyan); }
        .title-quit { color: var(--card-pink); }

        /* List Container for Full Cards */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 22px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 15px 0;
        }

        /* Habit Cards */
        .habit-card {
            background: rgba(10, 16, 28, 0.85);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .card-start {
            border: 1.5px solid var(--card-cyan);
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .card-start.done {
            border-color: var(--card-green);
            box-shadow: 0 0 14px var(--green-glow);
        }

        .card-start.failed {
            border-color: var(--card-pink);
            box-shadow: 0 0 14px var(--pink-glow);
        }

        .card-quit {
            border: 1.5px solid var(--card-pink);
            box-shadow: 0 0 12px var(--pink-glow);
        }

        .card-quit.done {
            border-color: var(--card-green);
            box-shadow: 0 0 14px var(--green-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-icon {
            font-size: 1rem;
        }

        .streak-info {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 700;
        }

        /* 7-Day Interactive History Row */
        .history-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(5, 8, 17, 0.6);
            border-radius: 12px;
            padding: 8px 10px;
        }

        .history-label {
            font-size: 0.6rem;
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-pills {
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }

        .pill {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 2px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
        }

        .pill.pass {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--card-green);
            color: var(--card-green);
        }

        .pill.fail {
            background: rgba(255, 0, 127, 0.15);
            border-color: var(--card-pink);
            color: var(--card-pink);
        }

        .pill.today-highlight {
            border-color: var(--card-cyan);
        }

        /* Action Row: PASS / FAIL / DELETE */
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .btn-pass {
            flex: 1;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--card-green);
            color: var(--card-green);
            padding: 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .btn-pass.active {
            background: var(--card-green);
            color: #000;
            box-shadow: 0 0 10px var(--green-glow);
        }

        .btn-fail {
            flex: 1;
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--card-pink);
            color: var(--card-pink);
            padding: 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .btn-fail.active {
            background: var(--card-pink);
            color: #fff;
            box-shadow: 0 0 10px var(--pink-glow);
        }

        .btn-del {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0 4px;
        }

        /* Input Form */
        .add-form {
            background: rgba(10, 16, 28, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 22px;
            display: flex;
            gap: 8px;
        }

        .add-input {
            flex: 1;
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
        }

        .add-select {
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            outline: none;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--card-cyan), var(--card-green));
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Floating Dock */
        .nav-dock {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            background: rgba(10, 16, 28, 0.9);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 26px;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .dock-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--card-cyan);
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }

        .dock-icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Header Grid Analytics -->
    <div class="dashboard-header">
        <div class="ring-box">
            <svg class="ring-svg">
                <defs>
                    <linearGradient id="cyan-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#00ff66" />
                    </linearGradient>
                </defs>
                <circle class="ring-bg" cx="55" cy="55" r="42" />
                <circle class="ring-progress" id="ringProgress" cx="55" cy="55" r="42" />
            </svg>
            <div class="ring-info">
                <div class="ring-percent" id="ringPercent">0%</div>
                <div class="ring-label">COMPLETED<br>PULSE</div>
            </div>
        </div>

        <div class="graph-box">
            <svg class="line-svg">
                <path d="M0 40 Q 20 10, 40 30 T 70 15 T 100 25 T 130 5" />
            </svg>
            <div class="week-days">
                <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
            </div>
        </div>
    </div>

    <!-- Add Habit Form -->
    <div class="add-form">
        <input type="text" id="habitInput" class="add-input" placeholder="New Habit Name" />
        <select id="habitType" class="add-select">
            <option value="start">START</option>
            <option value="quit">QUIT</option>
        </select>
        <button class="add-btn" onclick="addHabit()">+ ADD</button>
    </div>

    <!-- START Section -->
    <div class="section-header">
        <div class="section-title-main">Active Habits</div>
        <div class="section-title-sub title-start">START (Building)</div>
    </div>
    <div class="list-container" id="startContainer"></div>

    <!-- QUIT Section -->
    <div class="section-header">
        <div class="section-title-sub title-quit">QUIT (Breaking)</div>
    </div>
    <div class="list-container" id="quitContainer"></div>

    <!-- Floating Dock -->
    <div class="nav-dock">
        <div class="dock-tab">
            <span class="dock-icon">🏠</span>
            <span>Dashboard</span>
        </div>
    </div>

    <script>
        // Use active key to preserve existing habits
        let habits = JSON.parse(localStorage.getItem('cyber_habits_custom')) || [];
        
        function getISO(d) {
            return d.toISOString().split('T')[0];
        }

        const today = new Date();
        const todayStr = getISO(today);

        // Calculate last 7 days array (Monday through Sunday or trailing 7 days)
        function getLast7Days() {
            let days = [];
            for (let i = 6; i >= 0; i--) {
                let d = new Date();
                d.setDate(today.getDate() - i);
                days.push({
                    dateStr: getISO(d),
                    dayLabel: d.toLocaleDateString('en-US', { weekday: 'narrow' })
                });
            }
            return days;
        }

        // Migration helper: Preserve old habits & existing streak numbers
        function sanitizeData() {
            habits.forEach(h => {
                if (!h.completedDates) h.completedDates = [];
                if (!h.failedDates) h.failedDates = [];
                if (h.streak === undefined) h.streak = h.completedDates.length || 0;
            });
        }
        sanitizeData();

        function saveHabits() {
            localStorage.setItem('cyber_habits_custom', JSON.stringify(habits));
            render();
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const type = document.getElementById('habitType').value;
            const title = input.value.trim().toUpperCase();

            if (!title) return;

            habits.push({
                id: Date.now().toString(),
                title: title,
                icon: type === 'start' ? '⚡' : '🚫',
                type: type,
                streak: 0,
                completedDates: [],
                failedDates: []
            });

            input.value = '';
            saveHabits();
        }

        function setStatus(id, targetDate, status) {
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            const passIdx = habit.completedDates.indexOf(targetDate);
            const failIdx = habit.failedDates.indexOf(targetDate);

            if (status === 'pass') {
                if (passIdx > -1) {
                    habit.completedDates.splice(passIdx, 1);
                } else {
                    habit.completedDates.push(targetDate);
                    if (failIdx > -1) habit.failedDates.splice(failIdx, 1);
                }
            } else if (status === 'fail') {
                if (failIdx > -1) {
                    habit.failedDates.splice(failIdx, 1);
                } else {
                    habit.failedDates.push(targetDate);
                    if (passIdx > -1) habit.completedDates.splice(passIdx, 1);
                }
            }

            // Recalculate streak based on total passes
            habit.streak = habit.completedDates.length;
            saveHabits();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveHabits();
        }

        function render() {
            const startContainer = document.getElementById('startContainer');
            const quitContainer = document.getElementById('quitContainer');

            const completedToday = habits.filter(h => h.completedDates.includes(todayStr)).length;
            const percent = habits.length > 0 ? Math.round((completedToday / habits.length) * 100) : 0;

            document.getElementById('ringPercent').textContent = `${percent}%`;
            const offset = 264 - (264 * percent) / 100;
            document.getElementById('ringProgress').style.strokeDashoffset = offset;

            startContainer.innerHTML = renderGroup(habits.filter(h => h.type === 'start'), 'No START habits added yet.');
            quitContainer.innerHTML = renderGroup(habits.filter(h => h.type === 'quit'), 'No QUIT habits added yet.');
        }

        function renderGroup(group, emptyMsgText) {
            if (group.length === 0) {
                return `<div class="empty-msg">${emptyMsgText}</div>`;
            }

            const last7 = getLast7Days();

            return group.map(h => {
                const isPassToday = h.completedDates.includes(todayStr);
                const isFailToday = h.failedDates.includes(todayStr);

                let cardState = '';
                if (isPassToday) cardState = 'done';
                else if (isFailToday) cardState = 'failed';

                const themeClass = h.type === 'start' ? `card-start ${cardState}` : `card-quit ${cardState}`;

                const historyHtml = last7.map(day => {
                    const isPass = h.completedDates.includes(day.dateStr);
                    const isFail = h.failedDates.includes(day.dateStr);
                    const isToday = day.dateStr === todayStr;

                    let pillClass = 'pill';
                    let icon = day.dayLabel;

                    if (isPass) { pillClass += ' pass'; icon = '✓'; }
                    else if (isFail) { pillClass += ' fail'; icon = '✕'; }
                    if (isToday) pillClass += ' today-highlight';

                    return `
                        <div class="${pillClass}" onclick="setStatus('${h.id}', '${day.dateStr}', '${isPass ? 'pass' : 'fail'}')">
                            <span>${day.dayLabel}</span>
                            <span>${icon}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="habit-card ${themeClass}">
                        <div class="card-header">
                            <span class="card-title">${h.title}</span>
                            <span class="card-icon">${h.icon}</span>
                        </div>
                        
                        <div class="streak-info">
                            🔥 ${h.streak || 0} day streak
                        </div>

                        <div class="history-row">
                            <div class="history-label">7-Day Log (Tap past day to edit)</div>
                            <div class="history-pills">${historyHtml}</div>
                        </div>

                        <div class="card-actions">
                            <button class="btn-pass ${isPassToday ? 'active' : ''}" onclick="setStatus('${h.id}', '${todayStr}', 'pass')">
                                ✓ PASS
                            </button>
                            <button class="btn-fail ${isFailToday ? 'active' : ''}" onclick="setStatus('${h.id}', '${todayStr}', 'fail')">
                                ✕ FAIL
                            </button>
                            <button class="btn-del" onclick="deleteHabit('${h.id}')">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        render();
    </script>
</body>
</html>

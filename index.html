<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Habit Tracker PWA</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050811">
    
    <style>
        :root {
            --bg-black: #050811;
            --card-cyan: #00f0ff;
            --card-green: #00ff66;
            --card-pink: #ff007f;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --green-glow: rgba(0, 255, 102, 0.35);
            --pink-glow: rgba(255, 0, 127, 0.35);
            --text-main: #ffffff;
            --text-dim: #708090;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 15px) 16px 110px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* Top Status Bar */
        .top-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 15px;
            padding: 0 4px;
        }

        /* Dashboard Analytics Header */
        .dashboard-header {
            background: rgba(10, 16, 28, 0.85);
            border: 1.5px solid rgba(0, 240, 255, 0.4);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 0 20px var(--cyan-glow);
            margin-bottom: 22px;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 15px;
            align-items: center;
        }

        .ring-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 7;
        }

        .ring-progress {
            fill: none;
            stroke: url(#cyan-green-grad);
            stroke-width: 7;
            stroke-dasharray: 264;
            stroke-dashoffset: 264;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .ring-info {
            position: absolute;
            text-align: center;
        }

        .ring-percent {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--card-cyan);
            text-shadow: 0 0 10px var(--card-cyan);
        }

        .ring-label {
            font-size: 0.55rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            font-weight: 700;
            margin-top: 2px;
        }

        .graph-box {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100px;
        }

        .line-svg {
            width: 100%;
            height: 60px;
        }

        .line-svg path {
            fill: none;
            stroke: var(--card-cyan);
            stroke-width: 2.5;
            filter: drop-shadow(0px 0px 6px var(--card-cyan));
        }

        .week-days {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-dim);
            font-weight: 700;
        }

        /* Section Titles */
        .section-header {
            margin-bottom: 12px;
        }

        .section-title-main {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .section-title-sub {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .title-start { color: var(--card-cyan); }
        .title-quit { color: var(--card-pink); }

        /* Grid Containers */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .full-width {
            grid-column: span 2;
        }

        .empty-msg {
            grid-column: span 2;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 15px 0;
        }

        /* Habit Cards */
        .habit-card {
            background: rgba(10, 16, 28, 0.8);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .card-start {
            border: 1.5px solid var(--card-cyan);
            box-shadow: 0 0 14px var(--cyan-glow);
        }

        .card-start.done {
            border-color: var(--card-green);
            box-shadow: 0 0 14px var(--green-glow);
        }

        .card-quit {
            border: 1.5px solid var(--card-pink);
            box-shadow: 0 0 14px var(--pink-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-icon {
            font-size: 0.95rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-dim);
            font-weight: 700;
        }

        /* Action Buttons */
        .btn-track {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid var(--card-cyan);
            color: var(--card-cyan);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .btn-done {
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--card-green);
            color: var(--card-green);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-quit-done {
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--card-pink);
            color: var(--card-pink);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-del {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.85rem;
            cursor: pointer;
            padding-left: 6px;
        }

        /* Input Form */
        .add-form {
            background: rgba(10, 16, 28, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 22px;
            display: flex;
            gap: 8px;
        }

        .add-input {
            flex: 1;
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
        }

        .add-select {
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            outline: none;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--card-cyan), var(--card-green));
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Bottom Navbar Dock */
        .nav-dock {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 390px;
            background: rgba(10, 16, 28, 0.9);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .dock-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
        }

        .dock-tab.active {
            color: var(--card-cyan);
        }

        .dock-icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Header Grid Analytics -->
    <div class="dashboard-header">
        <div class="ring-box">
            <svg class="ring-svg">
                <defs>
                    <linearGradient id="cyan-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f0ff" />
                        <stop offset="100%" stop-color="#00ff66" />
                    </linearGradient>
                </defs>
                <circle class="ring-bg" cx="55" cy="55" r="42" />
                <circle class="ring-progress" id="ringProgress" cx="55" cy="55" r="42" />
            </svg>
            <div class="ring-info">
                <div class="ring-percent" id="ringPercent">0%</div>
                <div class="ring-label">COMPLETED<br>PULSE</div>
            </div>
        </div>

        <div class="graph-box">
            <svg class="line-svg">
                <path d="M0 40 Q 20 10, 40 30 T 70 15 T 100 25 T 130 5" />
            </svg>
            <div class="week-days">
                <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
            </div>
        </div>
    </div>

    <!-- Add Habit Control -->
    <div class="add-form">
        <input type="text" id="habitInput" class="add-input" placeholder="New Habit Name" />
        <select id="habitType" class="add-select">
            <option value="start">START</option>
            <option value="quit">QUIT</option>
        </select>
        <button class="add-btn" onclick="addHabit()">+ ADD</button>
    </div>

    <!-- START Section -->
    <div class="section-header">
        <div class="section-title-main">Active Habits</div>
        <div class="section-title-sub title-start">START (Building)</div>
    </div>
    <div class="grid-container" id="startContainer"></div>

    <!-- QUIT Section -->
    <div class="section-header">
        <div class="section-title-sub title-quit">QUIT (Breaking)</div>
    </div>
    <div class="grid-container" id="quitContainer"></div>

    <!-- Floating Dock -->
    <div class="nav-dock">
        <div class="dock-tab active">
            <span class="dock-icon">🏠</span>
            <span>Dashboard</span>
        </div>
        <div class="dock-tab">
            <span class="dock-icon">🎛️</span>
            <span>Habits</span>
        </div>
        <div class="dock-tab">
            <span class="dock-icon">📊</span>
            <span>Stats</span>
        </div>
        <div class="dock-tab">
            <span class="dock-icon">⚙️</span>
            <span>Settings</span>
        </div>
    </div>

    <script>
        // Cleared preset habits; starts with whatever you save or an empty list
        let habits = JSON.parse(localStorage.getItem('cyber_habits_custom')) || [];
        const todayStr = new Date().toISOString().split('T')[0];

        function saveHabits() {
            localStorage.setItem('cyber_habits_custom', JSON.stringify(habits));
            render();
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const type = document.getElementById('habitType').value;
            const title = input.value.trim().toUpperCase();

            if (!title) return;

            habits.push({
                id: Date.now().toString(),
                title: title,
                icon: type === 'start' ? '⚡' : '🚫',
                type: type,
                streak: 0,
                completedDates: []
            });

            input.value = '';
            saveHabits();
        }

        function toggleHabit(id) {
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            const idx = habit.completedDates.indexOf(todayStr);
            if (idx > -1) {
                habit.completedDates.splice(idx, 1);
                if (habit.streak > 0) habit.streak -= 1;
            } else {
                habit.completedDates.push(todayStr);
                habit.streak += 1;
            }
            saveHabits();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveHabits();
        }

        function render() {
            const startContainer = document.getElementById('startContainer');
            const quitContainer = document.getElementById('quitContainer');

            const completed = habits.filter(h => h.completedDates.includes(todayStr)).length;
            const percent = habits.length > 0 ? Math.round((completed / habits.length) * 100) : 0;

            document.getElementById('ringPercent').textContent = `${percent}%`;
            const offset = 264 - (264 * percent) / 100;
            document.getElementById('ringProgress').style.strokeDashoffset = offset;

            startContainer.innerHTML = renderGridGroup(habits.filter(h => h.type === 'start'), 'No START habits added yet.');
            quitContainer.innerHTML = renderGridGroup(habits.filter(h => h.type === 'quit'), 'No QUIT habits added yet.');
        }

        function renderGridGroup(group, emptyMsgText) {
            if (group.length === 0) {
                return `<div class="empty-msg">${emptyMsgText}</div>`;
            }

            return group.map(h => {
                const isDone = h.completedDates.includes(todayStr);
                const cardTheme = h.type === 'start' ? (isDone ? 'card-start done' : 'card-start') : 'card-quit';
                const btnClass = isDone ? (h.type === 'start' ? 'btn-done' : 'btn-quit-done') : 'btn-track';
                
                return `
                    <div class="habit-card ${cardTheme}">
                        <div class="card-header">
                            <span class="card-title">${h.title}</span>
                            <span class="card-icon">${h.icon}</span>
                        </div>
                        <div class="card-footer">
                            <span>Day ${h.streak || 0}</span>
                            <div>
                                <button class="${btnClass}" onclick="toggleHabit('${h.id}')">${isDone ? 'DONE ✓' : 'TRACK'}</button>
                                <button class="btn-del" onclick="deleteHabit('${h.id}')">✕</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        render();
    </script>
</body>
</html>
